# Full stack: PostgreSQL, Redis, API, Celery worker, web (nginx). Start with:  docker compose up --build
x-backend-env: &backend-env
  ENVIRONMENT: production
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
  DATABASE_URL: postgresql://scpds:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/scpds
  REDIS_URL: redis://redis:6379/0
  USE_CELERY: "true"
  STORAGE_DIR: /data/storage
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env (see .env.example)}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
  FACULTY_REGISTRATION_CODE: ${FACULTY_REGISTRATION_CODE:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scpds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: scpds
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scpds"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment: *backend-env
    volumes: [storage:/data/storage]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment: *backend-env
    volumes: [storage:/data/storage]
    depends_on:
      backend: {condition: service_started}

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    ports: ["8080:80"]
    depends_on:
      backend: {condition: service_healthy}

volumes:
  pgdata:
  storage:
