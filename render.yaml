services:
  - type: web
    name: scpd-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: scpd-storage
      mountPath: /data/storage
      sizeGB: 1
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scpd-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: scpd-redis
          type: redis
          property: connectionString
      - key: USE_CELERY
        value: "true"
      - key: STORAGE_DIR
        value: /data/storage
      - key: CORS_ORIGINS
        value: https://scpd-frontend.vercel.app
      - key: FRONTEND_URL
        value: https://scpd-frontend.vercel.app
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
      - key: FACULTY_REGISTRATION_CODE
        sync: false

  - type: worker
    name: scpd-worker
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: scpd-worker-storage
      mountPath: /data/storage
      sizeGB: 1
    dockerCommand: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scpd-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: scpd-redis
          type: redis
          property: connectionString
      - key: USE_CELERY
        value: "true"
      - key: STORAGE_DIR
        value: /data/storage

  - type: redis
    name: scpd-redis
    plan: free
    ipAllowList: []

databases:
  - name: scpd-db
    plan: free
    databaseName: scpd
    user: scpd
