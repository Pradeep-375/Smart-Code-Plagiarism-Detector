services:
  - type: web
    name: scpd-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scpd-db
          property: connectionString
      - key: USE_CELERY
        value: "false"
      - key: STORAGE_DIR
        value: /data/storage
      - key: CORS_ORIGINS
        value: https://scpd-frontend.vercel.app
      - key: FRONTEND_URL
        value: https://scpd-frontend.vercel.app
      - key: SEED_ADMIN_EMAIL
        value: admin@example.com
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "false"
      - key: FACULTY_REGISTRATION_CODE
        generateValue: true

databases:
  - name: scpd-db
    plan: free
    region: singapore
    databaseName: scpd
    user: scpd
